services:
  # HTTPS front door for the web UIs (https://<service>.anjos.fyi), with Let's
  # Encrypt certificates from the DNS-01 challenge. See caddy/Caddyfile.
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    hostname: caddy
    labels:
      - diun.enable=false  # locally built image: see caddy/Dockerfile
    networks:
      - media
      - smarthome
    ports:
      - 80:80
      - 443:443
      - 443:443/udp  # HTTP/3: caddy advertises it, so it must be reachable
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: wget --spider --quiet http://127.0.0.1:2019/config/ || exit 1
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 2s
    volumes:
      - proxy_caddy:/data
      - ./caddy:/etc/caddy:ro
    environment:
      - TZ=${TZ}
      - CF_API_TOKEN=${CF_API_TOKEN}
# Join the other stacks' networks to reach their services by hostname
networks:
  media:
    name: media_network
    external: true
  smarthome:
    name: smarthome_network
    external: true
volumes:
  proxy_caddy:
    external: true
