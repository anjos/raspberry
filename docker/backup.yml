services:
  rsnapshot:
    image: lscr.io/linuxserver/rsnapshot:latest
    container_name: rsnapshot
    restart: unless-stopped
    network_mode: bridge
    hostname: raspberry
    volumes:
      - backup_rsnapshot:/config
      - /backup:/.snapshots
      - media_plex:/data/media_plex
      - media_radarr:/data/media_radarr
      - media_sonarr:/data/media_sonarr
      - media_chaptarr:/data/media_chaptarr
      - media_qbittorrent:/data/media_qbittorrent
      - media_prowlarr:/data/media_prowlarr
      - monitor_diun:/data/monitor_diun
      - proxy_caddy:/data/proxy_caddy
      - smarthome_mosquitto_data:/data/smarthome_mosquitto_data
      - smarthome_mosquitto_log:/data/smarthome_mosquitto_log
      - smarthome_zigbee2mqtt:/data/smarthome_zigbee2mqtt
      - smarthome_homebridge:/data/smarthome_homebridge
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
volumes:
  backup_rsnapshot:
    external: true
  media_plex:
    external: true
  media_radarr:
    external: true
  media_sonarr:
    external: true
  media_chaptarr:
    external: true
  media_qbittorrent:
    external: true
  media_prowlarr:
    external: true
  monitor_diun:
    external: true
  proxy_caddy:
    external: true
  smarthome_mosquitto_data:
    external: true
  smarthome_mosquitto_log:
    external: true
  smarthome_zigbee2mqtt:
    external: true
  smarthome_homebridge:
    external: true
